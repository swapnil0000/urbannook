# Wrangler config — Cloudflare Worker `urbannook-s3-proxy-prod` (the website).
# Deployed by Jenkins (jenkins/prod.Jenkinsfile, stage "Deploy workers") with
#   npx wrangler@4 deploy --config wrangler.s3-proxy-prod.toml
# Do NOT edit this worker's code in the Cloudflare dashboard — change
# urbannook-s3-proxy-prod.js here and deploy through Jenkins.
#
# Mirrors the dashboard state as of 2026-09-27 exactly, so a deploy changes
# the code only:
#   - Variables AWS_REGION / S3_BUCKET and secrets AWS_ACCESS_KEY_ID /
#     AWS_SECRET_ACCESS_KEY are set in the dashboard. keep_vars = true stops
#     wrangler from deleting the plain variables; secrets are never touched.
#   - Routes / custom domain / workers.dev as currently configured.

name = "urbannook-s3-proxy-prod"
main = "urbannook-s3-proxy-prod.js"
compatibility_date = "2026-07-24"
keep_vars = true

# Currently enabled in the dashboard. Consider turning off later
# (the whole site is also reachable on *.workers.dev — duplicate content for SEO).
workers_dev = true
preview_urls = false

routes = [
  { pattern = "www.urbannook.in/*", zone_name = "urbannook.in" },
  { pattern = "urbannook.in/*", zone_name = "urbannook.in" },
  { pattern = "urbannook.in", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 1
