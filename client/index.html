  <!-- Route-aware LCP preload. (The old global /assets/hero2.webp preload is gone — the 2040
       home no longer renders that image, so it only stole bandwidth.) On product pages we fetch
       the product JSON in parallel with the JS bundle and preload its first gallery image with
       high priority, so the LCP image starts downloading long before React renders it. -->
  <script>
    (function () {
      var path = location.pathname;
      function preload(href) {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'image'; l.href = href;
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
      var m = path.match(/^\/product\/([^\/?#]+)(?:\/([^\/?#]+))?/);
      if (!m) return;
      var host = location.hostname;
      var api = (host === 'localhost' || host === '127.0.0.1') ? 'http://localhost:8000/api/v1'
        : host.indexOf('urbannook.online') !== -1 ? 'https://api-staging.urbannook.online/api/v1'
        : 'https://api.urbannook.in/api/v1';
      fetch(api + '/product/' + encodeURIComponent(m[1]), { credentials: 'omit' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (res) {
          var v = res && res.data && res.data.variantDetails;
          if (!v || !v.length) return;
          var sel = null;
          if (m[2]) for (var i = 0; i < v.length; i++) if (v[i].sku === m[2]) sel = v[i];
          var img = (sel && sel.variantImage && sel.variantImage[0]) || (v[0].variantImage && v[0].variantImage[0]);
          if (img) preload(img);
        })
        .catch(function () {});
    })();
  </script>
