<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Urban Nook</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">

  <section class="page-head">
    <div class="wrap"><span class="kicker" style="color:#fff">Say Hi</span><h1>Contact</h1>
      <p>Questions, bulk orders, collabs — we read everything.</p></div>
  </section>

  <div class="wrap">
    <div class="contact-grid">
      <form data-demo class="reveal">
        <div class="field"><label>Name</label><input type="text" required placeholder="Your name"></div>
        <div class="field"><label>Email</label><input type="email" required placeholder="your@email.com"></div>
        <div class="field"><label>Subject</label><input type="text" placeholder="What's this about?"></div>
        <div class="field"><label>Message</label><textarea rows="5" required placeholder="Tell us more..."></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Send Message</button>
      </form>
      <div class="contact-info reveal">
        <h3 style="text-transform:uppercase;margin-bottom:18px">Reach Us</h3>
        <div><b>Email</b>hello@urbannook.store</div>
        <div><b>Support</b>support@urbannook.store</div>
        <div><b>Hours</b>Mon–Sat · 10am–7pm IST</div>
        <div><b>Collabs</b>partners@urbannook.store</div>
        <div style="border:none"><b>Social</b>@urbannook</div>
        <div style="border:none;padding-top:24px"><span class="dot"></span> <span class="mono" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)">Usually replies within a day</span></div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
