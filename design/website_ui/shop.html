<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Urban Nook</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

  <section class="shop-head">
    <div class="wrap">
      <span class="kicker" style="color:#fff">The Catalogue</span>
      <h1>Shop All</h1>
      <p>Every world, one grid. Filter by genre — the palette stays pure, the products do the talking.</p>
    </div>
  </section>

  <section class="section" style="padding-top:30px">
    <div class="wrap">
      <div class="filters reveal">
        <button class="chip" data-cat="All">All</button>
        <button class="chip" data-cat="Auto">Auto · Lamps</button>
        <button class="chip" data-cat="Tech">Tech · Desk</button>
      </div>
      <div class="grid" id="shopGrid"></div>
    </div>
  </section>

  <script src="assets/js/main.js"></script>
</body>
</html>
